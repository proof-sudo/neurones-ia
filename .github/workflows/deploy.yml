name: Deploy to VPS (preprod)

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy main → VPS preprod
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to preprod via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Déploiement démarré $(date)"
            cd ${{ secrets.VPS_DEPLOY_PATH }}

            # Récupérer la branche main
            git pull origin main

            # Reconstruire et redémarrer les containers
            docker compose up --build -d --remove-orphans

            # Nettoyer les images inutilisées
            docker image prune -f

            echo "✅ Déploiement terminé $(date)"
            docker compose ps
