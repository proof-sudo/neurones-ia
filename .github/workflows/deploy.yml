name: Deploy to VPS (preprod)

on:
  push:
    branches: [main]

# Un seul déploiement à la fois ; on NE coupe PAS un déploiement en cours
# (couper en plein milieu d'un `up` laisserait l'infra dans un état incohérent).
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository }}-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}-frontend

jobs:
  # ─── 1. Garde-fou qualité — bloque le déploiement si ça casse ───────────────
  # La CI ne tournait que sur les PR : un push direct sur `main` déployait sans
  # filet. Ce job remet la barrière sur le chemin du déploiement.
  quality:
    name: Quality gate (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Lint frontend
        run: npm ci && npm run lint
        working-directory: frontend

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Lint backend (ruff)
        # Config (select/ignore/exclude) pilotée par backend/ruff.toml.
        run: pip install ruff && ruff check backend/
      - name: Test backend (pytest unit)
        run: pip install -r requirements.txt && pytest tests/unit -q
        working-directory: backend

  # ─── 2. Build + push des images vers GHCR ──────────────────────────────────
  # Le build se fait ici (runners GitHub costauds) et NON sur le VPS : fini le
  # risque d'OOM/downtime pendant un `next build`/`pip install` sur un serveur
  # déjà chargé (ollama 3.5G). Chaque image est taguée par SHA → rollback possible.
  build-push:
    name: Build & push images (GHCR)
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
            ${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://187.127.228.104:8080/api/v1' }}
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
            ${{ env.IMAGE_FRONTEND }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # ─── 3. Déploiement sur le VPS — pull + up + healthcheck + rollback ─────────
  deploy:
    name: Deploy → VPS preprod
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      # Le runner a besoin du docker-compose.yml pour l'envoyer au VPS (remplace le git pull).
      - uses: actions/checkout@v4

      - name: Upload docker-compose.yml to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.yml
          target: ${{ secrets.VPS_DEPLOY_PATH }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Passe ces variables au shell distant sans les inliner dans le script.
          envs: IMAGE_TAG,GHCR_USER,GHCR_PAT
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_DEPLOY_PATH }}"

            echo "🚀 Déploiement de ${IMAGE_TAG} démarré $(date)"

            # Auth GHCR (pull des images privées). Le PAT (read:packages) est
            # injecté via stdin, jamais écrit dans un fichier ni loggé.
            echo "${GHCR_PAT}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            # docker-compose.yml vient d'être déposé par scp ci-dessus — aucune dépendance
            # git côté VPS. Les images, elles, viennent de GHCR (docker compose pull).

            # Tag déployé actuellement, pour rollback éventuel.
            PREV_TAG="$(cat .deployed_tag 2>/dev/null || echo '')"
            echo "Tag précédent : ${PREV_TAG:-aucun}"

            export IMAGE_TAG
            docker compose pull backend frontend

            OK=1
            if docker compose up -d --wait --wait-timeout 180 --remove-orphans; then
              # Garde-fou applicatif (au-delà des healthchecks compose).
              curl -fsS --max-time 10 http://127.0.0.1:8000/v1/health > /dev/null || OK=0
              curl -fsS --max-time 10 http://127.0.0.1:3001 > /dev/null || OK=0
            else
              OK=0
            fi

            if [ "$OK" = "1" ]; then
              echo "${IMAGE_TAG}" > .deployed_tag
              docker image prune -f
              echo "✅ Déploiement OK $(date)"
              docker compose ps
            else
              echo "❌ Échec du déploiement — rollback"
              if [ -n "${PREV_TAG}" ]; then
                IMAGE_TAG="${PREV_TAG}" docker compose up -d --wait --wait-timeout 180 --remove-orphans || true
                echo "↩️  Rollback vers ${PREV_TAG} effectué"
              else
                echo "⚠️  Aucun tag précédent connu — pas de rollback automatique possible"
              fi
              docker compose ps
              exit 1
            fi
