name: CI

on:
  pull_request:
    branches: [main, dev, preprod]

# Annule une CI précédente encore en cours sur la même PR/branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint frontend (ESLint) ────────────────────────────────────────────────
  lint-frontend:
    name: Lint Frontend (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: frontend

  # ─── Lint backend (Ruff) ───────────────────────────────────────────────────
  lint-backend:
    name: Lint Backend (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        # Config (select/ignore/exclude) pilotée par backend/ruff.toml.
        run: ruff check backend/

  # ─── Tests backend (pytest — tests unitaires) ──────────────────────────────
  test-backend:
    name: Test Backend (pytest unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      # Settings ont toutes des valeurs par défaut (cf. config/settings.py) :
      # aucun secret requis. On ne lance QUE les tests unitaires — les tests
      # d'intégration (tests/integration) nécessitent des services externes.
      - name: Run unit tests
        run: pytest tests/unit -q
        working-directory: backend

  # ─── Validation des images Docker (build sans push) ────────────────────────
  # Attrape à l'heure de la PR ce qui ne se voyait avant qu'au déploiement :
  # Dockerfile cassé, pip install impossible, `next build` en échec.
  build-images:
    name: Build images (validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://187.127.228.104:8080/api/v1' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
