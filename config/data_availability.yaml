    motif: "Données brutes riches (expected_revenue 99,8%, date_deadline 99,3%). Une version par RÈGLES SIMPLES (proximité d'échéance, probabilité déclarée) est possible sans M5 ; une version calibrée sur fiabilité historique ne l'est pas."
