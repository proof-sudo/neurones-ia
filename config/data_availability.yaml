    proxy: false
    seuil_activation: null

  module_06_credibilite_forecast:
    statut: indisponible
    motif: "Nécessite M5 (scoring calibré sur fiabilité historique par commercial/étape) — bloqué : aucun mécanisme de snapshot du pipeline (Lot 0 non livré), et l'historisation native Odoo (mail.tracking.value) n'a pas pu être vérifiée (accès refusé)."
    moteurs_requis: [M5]
    champs_requis: [historique_stage_id, historique_probability]
    champs_manquants: [snapshot quotidien (Lot 0, absent), mail.tracking.value (accès refusé)]
