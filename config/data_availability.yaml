# Registre de disponibilité — Phase 1 du portage de la maquette Neurones Intelligence
#
# Source de vérité de tout l'affichage conditionnel (§3.2 du prompt de portage).
# Le front doit lire ce registre, jamais coder en dur un placeholder.
# Recalculé à chaque exécution du profiling (backend/scripts/profiling_portage_phase1*.py),
# pas maintenu à la main une fois l'automatisation en place — ce premier registre est
# initial et partiellement rempli à la main à partir des résultats de la Phase 1
# (docs/portage/01-audit-donnees.md), en attendant un calcul automatisé du champ
# `taux_remplissage` module par module.
#
# statut : disponible | degrade | indisponible
# moteurs_requis : sous-ensemble de [M1, M2, M3, M4, M5]
# proxy : true si le module ne mesure jamais une réalité directe, seulement une
#         approximation calculée (ex. carnet de commandes en lieu de charge réelle)

genere_le: "2026-07-28"
version_registre: 1

modules:

  module_01_briefing_direction:
    statut: disponible
    motif: "Synthèse déjà produite en production (briefing IA du tableau de bord), s'appuie sur des agrégats déjà calculés."
    moteurs_requis: []
    champs_requis: []
    champs_manquants: []
    proxy: false
    seuil_activation: null

  module_02_atterrissage_scenarios:
    statut: degrade
    motif: "Projection simple du pipeline pondéré actuel possible (invoice_origin 99,7% rempli). Les scénarios calibrés sur fiabilité historique dépendent de M5, bloqué (historisation non vérifiable, accès Odoo insuffisant)."
    moteurs_requis: [M3, M5]
    champs_requis: [account.move.invoice_origin, crm.lead.expected_revenue, crm.lead.probability]
    champs_manquants: [mail.tracking.value (accès refusé)]
    taux_remplissage: 0.997
    proxy: false
    seuil_activation: 0.80

  module_03_radar_dependance_client:
    statut: degrade
    motif: "Concentration par volume calculable nativement (mécanisme déjà construit côté fournisseurs). Le volet 'compétence/expertise rare' (M4) est dégradé par l'absence de segmentation produit exploitable."
    moteurs_requis: [M1, M4]
    champs_requis: [sale.order.date_order, account.move.amount_total, product.categ_id]
    champs_manquants: [segmentation produit significative (categ_id à 97% dans une seule valeur "All")]
    taux_remplissage: 0.03
    proxy: false
    seuil_activation: 0.50

  module_04_ecart_budgetaire:
    statut: indisponible
    motif: "Aucune notion de 'budget' trouvée dans le dépôt ni dans le profiling Odoo — absence conceptuelle, pas un problème de taux de remplissage."
    moteurs_requis: [M4]
    champs_requis: []
    champs_manquants: ["notion de budget (inexistante)"]
    proxy: false
    seuil_activation: null

