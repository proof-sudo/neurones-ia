services:

  # ─── LLM local (fallback Claude → GPT → Ollama) ─────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: neurones-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    deploy:
      resources:
        limits:
          memory: 3.5G
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 20s

  # ─── Backend FastAPI ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neurones-ia-backend
    restart: unless-stopped
    env_file: .env.prod
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - neurones_data:/app/data
    depends_on:
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G

  # ─── Frontend Next.js ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://187.127.228.104:8080/api/v1
    container_name: neurones-ia-frontend
    restart: unless-stopped
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      backend:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  ollama_models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/neurones-ia/ollama_models
  neurones_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/neurones-ia/data
