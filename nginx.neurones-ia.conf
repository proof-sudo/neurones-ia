# ============================================================
#  Neurones IA — Nginx vhost
#  Accessible via :
#    - http://ia.neuronestech.com  (après config DNS)
#    - http://187.127.228.104:8080 (test direct par IP)
#  Installation :
#    cp /opt/neurones-ia/nginx.neurones-ia.conf /etc/nginx/sites-available/neurones-ia
#    ln -sf /etc/nginx/sites-available/neurones-ia /etc/nginx/sites-enabled/
#    nginx -t && systemctl reload nginx
# ============================================================

# ─── Accès via DNS : ia.neuronestech.com (port 80) ─────────
server {
    listen 80;
    server_name ia.neuronestech.com;

    client_max_body_size 50M;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}

# ─── Accès direct IP : 187.127.228.104:8080 (test sans DNS) ─
